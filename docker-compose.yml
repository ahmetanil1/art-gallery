services:
  db:
    image: postgres:16-alpine
    container_name: sanat_galerisi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanat_galerisi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanat_galerisi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanat_galerisi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sanat_galerisi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_files:/app/media:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media_files:
  static_files:
  frontend_dist:
